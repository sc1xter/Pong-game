<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong</title>
    
    <!-- ===== favicon ===== -->
    <link rel="icon" type="image/png" href="favicon.png" />
    
    <style>
        /* ===== ПЕРЕМЕННЫЕ ТЕМ ===== */
        :root {
            --bg-body: #0f0f23;
            --bg-container: #16213e;
            --bg-canvas: #0f0f23;
            --border-canvas: #0f3460;
            --bg-score: #0f3460;
            --text-primary: #e0e0e0;
            --text-secondary: #aaa;
            --text-muted: #888;
            --text-dim: #666;
            --text-dark: #444;
            --border-subtle: #2a3a6a;
            --border-row: #1a2a4a;
            --btn-bg: #2a3a6a;
            --btn-bg-hover: #3a4a7a;
            --btn-outline: #0f3460;
            --btn-outline-hover: #0f3460;
            --accent-blue: #00d4ff;
            --accent-pink: #ff6b81;
            --accent-yellow: #ffd93d;
            --accent-purple: #a29bfe;
            --accent-red: #e94560;
            --shadow-container: rgba(0,0,0,0.8);
            --shadow-inner: rgba(0, 100, 255, 0.1);
            --kbd-bg: #2a2a4a;
            --kbd-border: #444;
            --kbd-color: #fff;
            --desc-color: #888;
        }
        
        body.light-theme {
            --bg-body: #e8ecf5;
            --bg-container: #ffffff;
            --bg-canvas: #f5f7fb;
            --border-canvas: #c8d0e0;
            --bg-score: #e0e8f5;
            --text-primary: #1a1a2e;
            --text-secondary: #555;
            --text-muted: #777;
            --text-dim: #999;
            --text-dark: #bbb;
            --border-subtle: #d0d8e8;
            --border-row: #e8ecf5;
            --btn-bg: #d0d8e8;
            --btn-bg-hover: #b8c4d8;
            --btn-outline: #c8d0e0;
            --btn-outline-hover: #b8c4d8;
            --accent-blue: #0088cc;
            --accent-pink: #e94560;
            --accent-yellow: #d4a000;
            --accent-purple: #7c6fdc;
            --accent-red: #d03050;
            --shadow-container: rgba(0,0,0,0.15);
            --shadow-inner: rgba(0, 100, 255, 0.05);
            --kbd-bg: #e0e8f5;
            --kbd-border: #b8c4d8;
            --kbd-color: #1a1a2e;
            --desc-color: #777;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            user-select: none;
            transition: background 0.3s ease;
        }
        
        .container {
            background: var(--bg-container);
            padding: 30px 40px 25px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px var(--shadow-container);
            text-align: center;
            min-width: 500px;
            transition: background 0.3s ease;
        }
        
        .game-title {
            color: var(--text-primary);
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 8px;
            text-shadow: 0 0 30px var(--shadow-inner);
            transition: color 0.3s ease;
        }
        .game-title span {
            color: var(--accent-pink);
        }
        
        .game-description {
            color: var(--text-secondary);
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 30px;
            line-height: 1.5;
            transition: color 0.3s ease;
        }
        .game-description .highlight {
            color: var(--accent-blue);
            font-weight: bold;
        }
        
        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .menu-btn {
            background: transparent;
            border: 2px solid var(--btn-outline);
            color: var(--text-primary);
            padding: 14px 20px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            position: relative;
        }
        
        .menu-btn:hover {
            background: var(--btn-outline-hover);
            color: #ffffff;
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--shadow-inner);
        }
        
        .menu-btn.play-btn {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(0, 212, 255, 0.05);
        }
        .menu-btn.play-btn:hover {
            background: var(--accent-blue);
            color: var(--bg-body);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }
        
        .menu-btn.leader-btn {
            border-color: var(--accent-yellow);
            color: var(--accent-yellow);
        }
        .menu-btn.leader-btn:hover {
            background: var(--accent-yellow);
            color: var(--bg-body);
            box-shadow: 0 0 30px rgba(255, 217, 61, 0.3);
        }
        
        .menu-btn.settings-btn {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }
        .menu-btn.settings-btn:hover {
            background: var(--accent-purple);
            color: var(--bg-body);
            box-shadow: 0 0 30px rgba(162, 155, 254, 0.3);
        }
        
        .menu-btn .icon {
            margin-right: 12px;
            font-size: 22px;
        }
        
        .hidden {
            display: none !important;
        }
        
        .leaderboard {
            color: var(--text-primary);
            text-align: left;
            margin: 10px 0 20px 0;
        }
        .leaderboard h3 {
            color: var(--accent-yellow);
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }
        .leaderboard table {
            width: 100%;
            border-collapse: collapse;
        }
        .leaderboard th {
            color: var(--text-muted);
            font-weight: normal;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        .leaderboard td {
            padding: 8px 0;
            text-align: center;
            font-size: 18px;
            border-bottom: 1px solid var(--border-row);
        }
        .leaderboard .rank {
            color: var(--accent-yellow);
            font-weight: bold;
        }
        .leaderboard .score-val {
            color: var(--accent-blue);
            font-weight: bold;
        }
        .leaderboard .empty-msg {
            text-align: center;
            color: var(--text-dim);
            padding: 30px 0;
            font-size: 16px;
        }
        .leaderboard .back-btn {
            background: var(--btn-bg);
            border: none;
            color: var(--text-primary);
            padding: 10px 30px;
            border-radius: 30px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
            width: 100%;
        }
        .leaderboard .back-btn:hover {
            background: var(--btn-bg-hover);
        }
        .leaderboard .clear-btn {
            background: var(--accent-red);
            border: none;
            color: #ffffff;
            padding: 10px 30px;
            border-radius: 30px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            width: 100%;
        }
        .leaderboard .clear-btn:hover {
            background: var(--accent-pink);
            transform: scale(1.02);
        }
        
        .settings {
            color: var(--text-primary);
            text-align: left;
            padding: 10px 0;
        }
        .settings h3 {
            color: var(--accent-purple);
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
            letter-spacing: 3px;
        }
        .settings .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-row);
        }
        .settings .setting-item .label {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .settings .setting-item .label .emoji {
            font-size: 22px;
        }
        .settings .setting-item .desc {
            color: var(--desc-color);
            font-size: 13px;
            margin-top: 4px;
        }
        
        .switch {
            position: relative;
            width: 50px;
            height: 28px;
            flex-shrink: 0;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .switch .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--btn-bg);
            border-radius: 28px;
            transition: 0.3s;
        }
        .switch .slider::before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: #888;
            border-radius: 50%;
            transition: 0.3s;
        }
        .switch input:checked + .slider {
            background-color: var(--accent-purple);
        }
        .switch input:checked + .slider::before {
            transform: translateX(22px);
            background-color: #fff;
        }
        
        .settings .back-btn {
            background: var(--btn-bg);
            border: none;
            color: var(--text-primary);
            padding: 10px 30px;
            border-radius: 30px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
            width: 100%;
        }
        .settings .back-btn:hover {
            background: var(--btn-bg-hover);
        }
        
        #gameScreen {
            margin-top: 10px;
        }
        #gameScreen .scoreboard {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            margin-bottom: 15px;
        }
        #gameScreen .scoreboard span {
            background: var(--bg-score);
            padding: 5px 25px;
            border-radius: 30px;
            letter-spacing: 2px;
            transition: background 0.3s ease;
        }
        #gameScreen canvas {
            background: var(--bg-canvas);
            border: 3px solid var(--border-canvas);
            border-radius: 12px;
            display: block;
            margin: 0 auto;
            box-shadow: inset 0 0 30px var(--shadow-inner);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        #gameScreen .controls-info {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #gameScreen .controls-info kbd {
            background: var(--kbd-bg);
            color: var(--kbd-color);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--kbd-border);
            font-size: 13px;
        }
        #gameScreen .controls-info .exit-btn {
            background: var(--accent-red);
            border: none;
            color: white;
            font-weight: bold;
            padding: 6px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        #gameScreen .controls-info .exit-btn:hover {
            background: var(--accent-pink);
            transform: scale(1.05);
        }
        
        @media (max-width: 600px) {
            .container {
                min-width: unset;
                width: 95%;
                padding: 20px;
            }
            .game-title {
                font-size: 28px;
            }
            .game-description {
                font-size: 12px;
            }
            .menu-btn {
                font-size: 16px;
                padding: 12px 16px;
            }
            #gameScreen canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="game-title">🏓 P<span>o</span>ng</div>
        
        <div class="game-description">
            Классическая аркада <span class="highlight">на двоих</span>.<br>
            Отбивайте мяч ракетками, набирайте очки и побеждайте!
        </div>
        
        <div id="mainMenu">
            <div class="menu">
                <button class="menu-btn play-btn" onclick="showGame()">
                    <span class="icon">▶</span> Играть
                </button>
                <button class="menu-btn leader-btn" onclick="showLeaderboard()">
                    <span class="icon">🏆</span> Таблица лидеров
                </button>
                <button class="menu-btn settings-btn" onclick="showSettings()">
                    <span class="icon">⚙</span> Настройки
                </button>
            </div>
        </div>
        
        <div id="leaderboardScreen" class="hidden">
            <div class="leaderboard">
                <h3>🏆 Таблица лидеров</h3>
                <div id="leaderboardContent"></div>
                <button class="back-btn" onclick="showMainMenu()">← Назад</button>
                <button class="clear-btn" onclick="clearLeaderboard()">🗑 Очистить таблицу</button>
            </div>
        </div>
        
        <div id="settingsScreen" class="hidden">
            <div class="settings">
                <h3>⚙ Настройки</h3>
                
                <div class="setting-item">
                    <div>
                        <div class="label">
                            <span class="emoji">🔊</span> Звук отбивания
                        </div>
                        <div class="desc">Вкл/Выкл звук при ударе мяча о ракетку</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="soundToggle" checked />
                        <span class="slider"></span>
                    </label>
                </div>
                
                <div class="setting-item">
                    <div>
                        <div class="label">
                            <span class="emoji">🎨</span> Светлая тема
                        </div>
                        <div class="desc">Переключение между тёмной и светлой темой</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="themeToggle" />
                        <span class="slider"></span>
                    </label>
                </div>
                
                <button class="back-btn" onclick="showMainMenu()">← Назад</button>
            </div>
        </div>
        
        <div id="gameScreen" class="hidden">
            <div class="scoreboard">
                <span id="scoreLeft">0</span>
                <span style="color:#555;">|</span>
                <span id="scoreRight">0</span>
            </div>
            <canvas id="pongCanvas" width="800" height="450"></canvas>
            <div class="controls-info">
                <div>
                    <kbd>W</kbd> <kbd>S</kbd> — левая
                </div>
                <div>
                    <kbd>↑</kbd> <kbd>↓</kbd> — правая
                </div>
                <button class="exit-btn" onclick="exitGame()">✕ Выйти</button>
            </div>
        </div>
    </div>
    
    <script>
        // ================================================================
        //  🏓  PONG — полная игра с меню, таблицей лидеров и настройками
        // ================================================================
        
        // ---------- 1. НАВИГАЦИЯ МЕЖДУ ЭКРАНАМИ ----------
        function showMainMenu() {
            document.getElementById('mainMenu').classList.remove('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('leaderboardScreen').classList.add('hidden');
            document.getElementById('settingsScreen').classList.add('hidden');
            if (gameRunning) {
                gameRunning = false;
            }
        }
        
        function showGame() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('leaderboardScreen').classList.add('hidden');
            document.getElementById('settingsScreen').classList.add('hidden');
            if (!gameRunning) {
                initGame();
            }
        }
        
        function showLeaderboard() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('leaderboardScreen').classList.remove('hidden');
            document.getElementById('settingsScreen').classList.add('hidden');
            renderLeaderboard();
        }
        
        function showSettings() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('leaderboardScreen').classList.add('hidden');
            document.getElementById('settingsScreen').classList.remove('hidden');
            loadSettings();
        }
        
        function exitGame() {
            showMainMenu();
        }
        
        // ---------- 2. НАСТРОЙКИ ----------
        function loadSettings() {
            const soundEnabled = localStorage.getItem('pong_sound_enabled');
            if (soundEnabled !== null) {
                document.getElementById('soundToggle').checked = soundEnabled === 'true';
            } else {
                document.getElementById('soundToggle').checked = true;
            }
            
            const lightTheme = localStorage.getItem('pong_light_theme');
            if (lightTheme === 'true') {
                document.getElementById('themeToggle').checked = true;
                document.body.classList.add('light-theme');
            } else {
                document.getElementById('themeToggle').checked = false;
                document.body.classList.remove('light-theme');
            }
        }
        
        function saveSettings() {
            const enabled = document.getElementById('soundToggle').checked;
            localStorage.setItem('pong_sound_enabled', JSON.stringify(enabled));
            soundEnabled = enabled;
        }
        
        function saveTheme() {
            const lightTheme = document.getElementById('themeToggle').checked;
            localStorage.setItem('pong_light_theme', JSON.stringify(lightTheme));
            if (lightTheme) {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
        }
        
        document.getElementById('soundToggle').addEventListener('change', saveSettings);
        document.getElementById('themeToggle').addEventListener('change', saveTheme);
        
        // ---------- 3. ТАБЛИЦА ЛИДЕРОВ ----------
        function renderLeaderboard() {
            const container = document.getElementById('leaderboardContent');
            let records = JSON.parse(localStorage.getItem('pong_leaderboard') || '[]');
            records.sort((a, b) => b.score - a.score);
            
            if (records.length === 0) {
                container.innerHTML = `
                    <div class="empty-msg">
                        🎮 Пока нет рекордов<br>
                        <span style="font-size:14px;color:var(--text-dark);">Сыграйте первую игру!</span>
                    </div>
                `;
                return;
            }
            
            const top = records.slice(0, 10);
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Игрок</th>
                            <th>Счёт</th>
                            <th>Дата</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            top.forEach((record, index) => {
                const rank = index + 1;
                const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
                const date = record.date ? new Date(record.date).toLocaleDateString() : '—';
                html += `
                    <tr>
                        <td class="rank">${medal}</td>
                        <td>${escapeHtml(record.name || 'Аноним')}</td>
                        <td class="score-val">${record.score}</td>
                        <td style="color:var(--text-dim);font-size:14px;">${date}</td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
                <div style="text-align:center;margin-top:15px;font-size:13px;color:var(--text-dark);">
                    Всего рекордов: ${records.length}
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ---------- 4. ДОБАВЛЕНИЕ РЕКОРДА ----------
        function addRecord(name, score) {
            const records = JSON.parse(localStorage.getItem('pong_leaderboard') || '[]');
            records.push({
                name: name || 'Аноним',
                score: score,
                date: new Date().toISOString()
            });
            if (records.length > 50) {
                records.sort((a, b) => b.score - a.score);
                records = records.slice(0, 50);
            }
            localStorage.setItem('pong_leaderboard', JSON.stringify(records));
        }
        
        // ---------- 5. ОЧИСТКА ТАБЛИЦЫ ЛИДЕРОВ ----------
        function clearLeaderboard() {
            const confirmed = confirm('🗑 Вы уверены, что хотите очистить таблицу лидеров?\n\nЭто действие нельзя отменить!');
            
            if (confirmed) {
                localStorage.removeItem('pong_leaderboard');
                renderLeaderboard();
                alert('✅ Таблица лидеров очищена!');
            }
        }
        
        // ---------- 6. ИГРОВАЯ ЛОГИКА ----------
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');
        const scoreLeftEl = document.getElementById('scoreLeft');
        const scoreRightEl = document.getElementById('scoreRight');
        
        const W = 800;
        const H = 450;
        
        let gameRunning = false;
        let animId = null;
        let soundEnabled = true;
        
        loadSettings();
        
        const leftPaddle = {
            x: 30,
            y: H/2 - 35,
            w: 12,
            h: 70,
            speed: 5,
            score: 0
        };
        
        const rightPaddle = {
            x: W - 30 - 12,
            y: H/2 - 35,
            w: 12,
            h: 70,
            speed: 5,
            score: 0
        };
        
        const ball = {
            x: W/2,
            y: H/2,
            radius: 8,
            dx: 4,
            dy: 3,
            speed: 5
        };
        
        const keys = {
            w: false,
            s: false,
            arrowup: false,
            arrowdown: false
        };
        
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            
            if (key === 'w' || key === 'W') {
                keys.w = true;
                e.preventDefault();
            }
            if (key === 's' || key === 'S') {
                keys.s = true;
                e.preventDefault();
            }
            if (key === 'ArrowUp') {
                keys.arrowup = true;
                e.preventDefault();
            }
            if (key === 'ArrowDown') {
                keys.arrowdown = true;
                e.preventDefault();
            }
            if (key === 'Escape') {
                if (!document.getElementById('gameScreen').classList.contains('hidden')) {
                    exitGame();
                }
                e.preventDefault();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            const key = e.key;
            
            if (key === 'w' || key === 'W') {
                keys.w = false;
                e.preventDefault();
            }
            if (key === 's' || key === 'S') {
                keys.s = false;
                e.preventDefault();
            }
            if (key === 'ArrowUp') {
                keys.arrowup = false;
                e.preventDefault();
            }
            if (key === 'ArrowDown') {
                keys.arrowdown = false;
                e.preventDefault();
            }
        });
        
        let audioCtx = null;
        
        function playHitSound() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 440 + Math.random() * 200;
                osc.type = 'square';
                gain.gain.value = 0.1;
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }
        
        function getAccentColors() {
            const isLight = document.body.classList.contains('light-theme');
            if (isLight) {
                return {
                    leftPaddle: '#0088cc',
                    rightPaddle: '#e94560',
                    ball: '#1a1a2e',
                    centerLine: '#c8d0e0'
                };
            } else {
                return {
                    leftPaddle: '#00d4ff',
                    rightPaddle: '#ff6b81',
                    ball: '#ffffff',
                    centerLine: '#2a3a6a'
                };
            }
        }
        
        function resetBall(direction) {
            ball.x = W/2;
            ball.y = H/2;
            ball.speed = 5;
            ball.dx = direction * ball.speed;
            ball.dy = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 3);
        }
        
        function fullReset() {
            leftPaddle.score = 0;
            rightPaddle.score = 0;
            leftPaddle.y = H/2 - 35;
            rightPaddle.y = H/2 - 35;
            ball.speed = 5;
            resetBall(1);
            updateScoreDisplay();
        }
        
        function updateScoreDisplay() {
            scoreLeftEl.textContent = leftPaddle.score;
            scoreRightEl.textContent = rightPaddle.score;
        }
        
        function handleCollisions() {
            if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= H) {
                ball.dy = -ball.dy;
                playHitSound();
            }
            
            if (ball.dx < 0) {
                const p = leftPaddle;
                if (ball.x - ball.radius <= p.x + p.w &&
                    ball.x + ball.radius >= p.x &&
                    ball.y >= p.y && ball.y <= p.y + p.h) {
                    ball.dx = -ball.dx;
                    const hitPos = (ball.y - p.y) / p.h;
                    ball.dy = (hitPos - 0.5) * 8;
                    ball.speed += 0.2;
                    const curSpeed = Math.sqrt(ball.dx*ball.dx + ball.dy*ball.dy);
                    if (curSpeed > 0) {
                        ball.dx = (ball.dx / curSpeed) * ball.speed;
                        ball.dy = (ball.dy / curSpeed) * ball.speed;
                    }
                    playHitSound();
                }
            }
            
            if (ball.dx > 0) {
                const p = rightPaddle;
                if (ball.x + ball.radius >= p.x &&
                    ball.x - ball.radius <= p.x + p.w &&
                    ball.y >= p.y && ball.y <= p.y + p.h) {
                    ball.dx = -ball.dx;
                    const hitPos = (ball.y - p.y) / p.h;
                    ball.dy = (hitPos - 0.5) * 8;
                    ball.speed += 0.2;
                    const curSpeed = Math.sqrt(ball.dx*ball.dx + ball.dy*ball.dy);
                    if (curSpeed > 0) {
                        ball.dx = (ball.dx / curSpeed) * ball.speed;
                        ball.dy = (ball.dy / curSpeed) * ball.speed;
                    }
                    playHitSound();
                }
            }
            
            if (ball.x - ball.radius < 0) {
                rightPaddle.score++;
                updateScoreDisplay();
                resetBall(1);
            } else if (ball.x + ball.radius > W) {
                leftPaddle.score++;
                updateScoreDisplay();
                resetBall(-1);
            }
        }
        
        function update() {
            if (keys.w && leftPaddle.y > 0) {
                leftPaddle.y -= leftPaddle.speed;
            }
            if (keys.s && leftPaddle.y + leftPaddle.h < H) {
                leftPaddle.y += leftPaddle.speed;
            }
            if (keys.arrowup && rightPaddle.y > 0) {
                rightPaddle.y -= rightPaddle.speed;
            }
            if (keys.arrowdown && rightPaddle.y + rightPaddle.h < H) {
                rightPaddle.y += rightPaddle.speed;
            }
            
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            handleCollisions();
        }
        
        function draw() {
            ctx.clearRect(0, 0, W, H);
            
            const colors = getAccentColors();
            
            ctx.strokeStyle = colors.centerLine;
            ctx.lineWidth = 2;
            ctx.setLineDash([15, 15]);
            ctx.beginPath();
            ctx.moveTo(W/2, 0);
            ctx.lineTo(W/2, H);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.beginPath();
            ctx.arc(W/2, H/2, 60, 0, Math.PI * 2);
            ctx.strokeStyle = colors.centerLine;
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = colors.leftPaddle;
            ctx.shadowColor = colors.leftPaddle;
            ctx.shadowBlur = 15;
            ctx.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.w, leftPaddle.h);
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = colors.rightPaddle;
            ctx.shadowColor = colors.rightPaddle;
            ctx.shadowBlur = 15;
            ctx.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.w, rightPaddle.h);
            ctx.shadowBlur = 0;
            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = colors.ball;
            ctx.shadowColor = colors.ball;
            ctx.shadowBlur = 25;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            animId = requestAnimationFrame(gameLoop);
        }
        
        function initGame() {
            gameRunning = true;
            fullReset();
            if (animId) {
                cancelAnimationFrame(animId);
                animId = null;
            }
            gameLoop();
        }
        
        function saveGameResult() {
            const leftScore = leftPaddle.score;
            const rightScore = rightPaddle.score;
            const winnerScore = Math.max(leftScore, rightScore);
            if (winnerScore > 0) {
                const name = prompt('🎉 Игра окончена! Введите ваше имя для таблицы лидеров:', 'Игрок');
                if (name !== null && name.trim() !== '') {
                    addRecord(name.trim(), winnerScore);
                } else if (name !== null) {
                    addRecord('Аноним', winnerScore);
                }
            }
        }
        
        const originalExitGame = exitGame;
        exitGame = function() {
            if (gameRunning) {
                saveGameResult();
                gameRunning = false;
                if (animId) {
                    cancelAnimationFrame(animId);
                    animId = null;
                }
            }
            originalExitGame();
        };
        
        // ---------- СТАРТ ----------
        showMainMenu();
    </script>
</body>
</html>
